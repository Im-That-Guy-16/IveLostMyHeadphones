<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IveLostMyHeadphones</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --panel: #111318;
      --text: #f3f4f6;
      --muted: #a1a7b3;
      --line: #2a2e37;
      --accent: #ff6b76;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(820px, calc(100% - 32px));
      margin: 0 auto;
      padding: 52px 0;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    section {
      margin-top: 28px;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    ul {
      margin: 0;
      padding-left: 18px;
    }

    li {
      margin: 10px 0;
    }

    a {
      color: var(--accent);
      word-break: break-all;
    }

    code {
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>IveLostMyHeadphones</h1>
    <p>Hosted stylesheet and optional companion script.</p>

    <section>
      <h2>Install Links</h2>
      <ul>
        <li><a href="Project-STMPE.css">Project-STMPE.css</a></li>
        <li><a href="RED-Enriched.user.js">RED-Enriched.user.js</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
